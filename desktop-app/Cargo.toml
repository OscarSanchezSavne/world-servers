[package]
name = "desktop-app2"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.34.3"
egui_extras = { version = "0.34", features = ["image"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", features = ["parse"] }
ssh2 = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
bevy = { version = "0.19", features = ["free_camera"] }
bevy_fontmesh = "0.6"
"bevy_egui" = "0.41"